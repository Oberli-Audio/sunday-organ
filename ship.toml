[product]
name = "Sunday Organ"              # bundle name
slug = "sunday-organ"                 # folder names; the tag stays v<VERSION> (one repo per plugin)
asset_name = "SundayOrgan"      # version-free asset names: SundayOrgan-macOS.zip, SundayOrgan-Windows-x64.zip
repo = "Oberli-Audio/sunday-organ"                 # GitHub owner/repo
formats = ["VST3"]                # the shipped set; add "AU" or "CLAP" when the product wants them (the CMake FORMATS line follows)

[macos]
deployment_target = "10.13"

[windows]
runtime = "MT"
arch = "SSE4.2"

[release]
sound_changed = false             # true: the changelog section must carry a "Sounds different:" line
state_version_bumped = false      # true: ... and "will not open in older versions"; the message says so
